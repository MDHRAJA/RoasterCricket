[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ipl-roster-backend"
version = "0.5.0"
description = "Read-only, time-safe IPL analytics API"
requires-python = ">=3.12"
# Vercel installs from this file. Keep the tested runtime identical to requirements-backend.txt.
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "click==8.5.0",
    "colorama==0.4.6",
    "fastapi==0.142.2",
    "h11==0.16.0",
    "idna==3.20",
    "numpy==2.5.3",
    "opentelemetry-api==1.45.0",
    "pydantic==2.13.5",
    "pydantic_core==2.46.5",
    "scipy==1.18.1",
    "starlette==1.7.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]
winner-research = ["scikit-learn>=1.9,<2", "threadpoolctl>=3.7,<4"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
